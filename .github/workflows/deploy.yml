name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency: deploy-production

jobs:
  deploy:
    name: Azure Container Apps
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build the API image in the registry
        run: |
          az acr build -r "${{ vars.ACR_NAME }}" \
            -t "resolveai-api:${{ github.sha }}" \
            -t "resolveai-api:latest" .

      - name: Roll out a new revision
        run: |
          az containerapp update \
            -g "${{ vars.RESOURCE_GROUP }}" -n resolveai-api \
            --image "${{ vars.ACR_NAME }}.azurecr.io/resolveai-api:${{ github.sha }}"
